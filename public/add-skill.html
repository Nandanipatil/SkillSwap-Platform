<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Skill - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-bolt"></i> SKILLSWAP</div>
        <ul id="navLinks">
            <!-- Dynamic Nav via app.js -->
        </ul>
    </nav>

    <div class="form-container">
        <h2 class="section-title" style="margin-bottom: 1.8rem;"><i class="fa-solid fa-plus-circle"></i> Share a New Skill</h2>
        
        <form id="addSkillForm">
            <div class="form-group">
                <label for="skillTitle">Skill Title</label>
                <input type="text" id="skillTitle" class="form-input" placeholder="e.g. Full Stack Web Development, Python Basics..." required>
            </div>

            <div class="form-group">
                <label for="skillCategory">Category</label>
                <select id="skillCategory" class="form-select" required>
                    <option value="Programming">Programming</option>
                    <option value="Design">Design</option>
                    <option value="Language">Language</option>
                    <option value="Music">Music</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="skillDescription">Description</label>
                <textarea id="skillDescription" class="form-textarea" rows="4" placeholder="Explain what you can teach or share with peers..." required></textarea>
            </div>

            <div class="form-group">
                <label for="skillImageUrl">Image URL (Optional)</label>
                <input type="url" id="skillImageUrl" class="form-input" placeholder="https://images.unsplash.com/...">
            </div>

            <button type="submit" class="btn-primary" style="margin-top: 1rem;"><i class="fa-solid fa-cloud-arrow-up"></i> Post Skill</button>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script src="js/add-skill.js"></script>
</body>
</html>
