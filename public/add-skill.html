<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share a New Skill - SkillSwap</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/index.html" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-arrows-rotate"></i></div>
                <span>SKILL<span class="logo-accent">SWAP</span></span>
            </a>
            <ul id="navLinks" class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/categories.html">Categories</a></li>
                <li><a href="/trades.html">My Trades</a></li>
                <li><a href="/add-skill.html" class="active">Add Skill</a></li>
                <li><a href="/profile.html">Profile</a></li>
                <li><a href="/login.html">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="main-content">
        <div class="form-wrapper">
            <div class="form-header text-center">
                <div class="hero-badge">
                    <i class="fa-solid fa-plus"></i> Community Contribution
                </div>
                <h1>Share a New Skill</h1>
                <p>Post your expertise to teach others and earn trade credits.</p>
            </div>

            <!-- Glassmorphic Form Card -->
            <form id="addSkillForm" class="glass-form">
                <div class="form-group">
                    <label for="skillTitle"><i class="fa-solid fa-heading"></i> Skill Title</label>
                    <input type="text" id="skillTitle" placeholder="e.g., Python Programming, UI/UX Design" required>
                </div>

                <div class="form-group">
                    <label for="skillCategory"><i class="fa-solid fa-layer-group"></i> Category</label>
                    <select id="skillCategory" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Programming">Programming</option>
                        <option value="Design">Design</option>
                        <option value="Business">Business</option>
                        <option value="Languages">Languages</option>
                        <option value="Music">Music</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skillDescription"><i class="fa-solid fa-align-left"></i> Description</label>
                    <textarea id="skillDescription" rows="4" placeholder="Describe what you can teach and your experience level..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="skillImageUrl"><i class="fa-solid fa-image"></i> Image URL (Optional)</label>
                    <input type="url" id="skillImageUrl" placeholder="https://example.com/image.jpg">
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Add Skill
                </button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/add_skill.js"></script>
</body>
</html>
