<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-code-compare"></i> SKILLSWAP</div>
        <ul id="navLinks">
            <!-- Dynamic Nav via app.js -->
        </ul>
    </nav>

    <header class="hero-section">
        <h1 class="hero-title">Learn and Share Skills Freely with AI Smart Matching</h1>
        <p class="hero-subtitle">Connect with peers, swap tech expertise, and get AI-driven match recommendations to accelerate your learning.</p>
    </header>

    <div class="main-container">
        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search skills by title or keyword (e.g. Python, Web Development)...">
            <select id="categoryFilter" class="category-select">
                <option value="All">All Categories</option>
                <option value="Programming">Programming</option>
                <option value="Design">Design</option>
                <option value="Language">Language</option>
                <option value="Music">Music</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div id="skillsContainer" class="skills-grid">
            <!-- Skill Cards Loaded via JS -->
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
