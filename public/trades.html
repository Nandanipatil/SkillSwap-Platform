<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trades - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-bolt"></i> SKILLSWAP</div>
        <ul id="navLinks">
            <!-- Dynamic Nav via app.js -->
        </ul>
    </nav>

    <div class="trades-container">
        
        <!-- Received Trade Requests -->
        <h2 class="section-title"><i class="fa-solid fa-inbox"></i> Trade Requests Received</h2>
        <div id="receivedTrades" class="trades-grid">
            <p style="color: #64748b;">Loading requests...</p>
        </div>

        <!-- Sent Trade Requests -->
        <h2 class="section-title"><i class="fa-solid fa-paper-plane"></i> Sent Requests</h2>
        <div id="sentTrades" class="trades-grid">
            <p style="color: #64748b;">Loading sent requests...</p>
        </div>

        <!-- AI Action Plan Box for Accepted Trades -->
        <div class="ai-roadmap-box">
            <h2 class="section-title" style="color: #818cf8;">
                <i class="fa-solid fa-wand-magic-sparkles"></i> AI Learning Action Plan
            </h2>
            <p style="color: #94a3b8; margin-bottom: 1rem; font-size: 0.95rem;">
                Select an accepted trade to view an AI-generated step-by-step skill exchange roadmap.
            </p>
            <div id="roadmapContent" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.6;">
                <p style="color: #64748b; font-style: italic;">No active exchange selected yet.</p>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
    <script src="js/trades.js"></script>
</body>
</html>
