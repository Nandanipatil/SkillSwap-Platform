<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>SkillSwap</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <!-- Login Card -->
        <div class="auth-card">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>

        <!-- Register Card -->
        <div class="auth-card">
            <h2>Register</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create password" required>
                </div>
                <div class="form-group">
                    <label for="regBio">Short Bio</label>
                    <textarea id="regBio" rows="3" placeholder="Tell us about your skills..."></textarea>
                </div>
                <button type="submit" class="btn-primary btn-success">Register Account</button>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
