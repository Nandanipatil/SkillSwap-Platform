<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-bolt"></i> SKILLSWAP</div>
        <ul id="navLinks">
            <!-- Dynamic Nav via app.js -->
        </ul>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-circle" id="userAvatar">U</div>
            <div>
                <h2 id="userName" style="font-size: 1.8rem; color: #fff;">User Name</h2>
                <p id="userEmail" style="color: #94a3b8; font-size: 0.95rem;">user@example.com</p>
            </div>
        </div>

        <h3 class="section-title" style="font-size: 1.4rem; margin-bottom: 1.2rem;">
            <i class="fa-solid fa-list-check"></i> My Shared Skills
        </h3>

        <div id="mySkillsGrid" class="skills-grid">
            <!-- User posted skills go here -->
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
